name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.8.4)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# #56: releases are ALL-OR-NOTHING. Each platform builds+tests and uploads its
# assets as a workflow ARTIFACT (never touching the actual GitHub Release).
# The `publish` job below has `needs: build`, which GitHub Actions only runs
# once EVERY matrix instance of `build` has succeeded -- so if either platform
# fails, `publish` is skipped entirely and NO GitHub Release/asset is ever
# created. The tag itself (pushed by ci.yml's auto-release job, which is what
# actually triggers this workflow) is left as a bare git ref in that case --
# invisible to install.sh/install.ps1, which both resolve the version via the
# `/releases/latest` API, never by walking tags. Before this fix, each
# platform published directly and independently, so a Windows-only failure
# still left a real, publicly-resolvable "latest" release with a missing
# Windows asset (v1.8.22, run 30333447928).
jobs:
  build:
    name: Build Release Asset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: dsync
            asset_name: dsync-linux-amd64
            tray_artifact_name: dsync-tray
            tray_asset_name: dsync-tray-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: dsync.exe
            asset_name: dsync-windows-amd64.exe
            tray_artifact_name: dsync-tray.exe
            tray_asset_name: dsync-tray-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev


      - name: Run Tests (Linux Only)
        if: runner.os == 'Linux'
        run: cargo test --workspace --verbose

      - name: Run Tests (Windows Only)
        if: runner.os == 'Windows'
        run: cargo test --workspace --verbose

      - name: Build Main (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --bin dsync --target ${{ matrix.target }} --verbose

      # dsync#132: the Linux tray links gtk, so its dev packages are installed only
      # here; the daemon above is built without the `tray` feature and never links gtk.
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Build Tray (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --features tray --bin dsync-tray --target ${{ matrix.target }} --verbose

      - name: Build Main & Tray (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --features tray --bin dsync --bin dsync-tray --target ${{ matrix.target }} --verbose

      # dsync#136: the follower probe (a dsync-ptp example) that dstack runs beside the service.
      - name: Build Probe (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p dsync-ptp --example dsync-ptp-probe --target ${{ matrix.target }} --verbose

      - name: Rename Artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/${{ matrix.tray_artifact_name }} ${{ matrix.tray_asset_name }}

      - name: Rename Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/${{ matrix.tray_artifact_name }} ${{ matrix.tray_asset_name }}
          cp target/${{ matrix.target }}/release/examples/dsync-ptp-probe.exe dsync-ptp-probe-windows-amd64.exe

      - name: Generate SHA256 Checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          sha256sum ${{ matrix.tray_asset_name }} > ${{ matrix.tray_asset_name }}.sha256

      - name: Generate SHA256 Checksums (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          sha256sum ${{ matrix.tray_asset_name }} > ${{ matrix.tray_asset_name }}.sha256
          sha256sum dsync-ptp-probe-windows-amd64.exe > dsync-ptp-probe-windows-amd64.exe.sha256

      # #56: upload as a workflow ARTIFACT, not a GitHub Release asset -- the
      # actual Release is created exactly once, by `publish`, only after
      # BOTH platforms reach this point successfully.
      - name: Upload Release Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
            ${{ matrix.tray_asset_name }}
            ${{ matrix.tray_asset_name }}.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload Release Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
            ${{ matrix.tray_asset_name }}
            ${{ matrix.tray_asset_name }}.sha256
            dsync-ptp-probe-windows-amd64.exe
            dsync-ptp-probe-windows-amd64.exe.sha256
          if-no-files-found: error
          retention-days: 1

  # #56: single atomic publish -- only reached once EVERY `build` matrix leg
  # (Linux AND Windows) has succeeded. GitHub Actions skips a job whose
  # `needs` target had ANY failing instance, so a Windows (or Linux) failure
  # here means this job never runs at all: no GitHub Release is created, no
  # asset is published, and the tag pushed by ci.yml's auto-release job is
  # left bare -- invisible to `/releases/latest`, which install.sh/install.ps1
  # actually query.
  publish:
    name: Publish Release (all platforms)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: List assets to publish
        run: ls -la release-assets

      - name: Publish GitHub Release (all platforms, one shot)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
